# HTTPS on PONGO_TLS_PORT with your own certificate, on top of docker-compose.host.yml:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.host.yml:docker-compose.own-cert.yml
# Put server-fullchain.crt and server.key in ./secrets/tls. The API then only
# listens on 127.0.0.1, behind Caddy.
services:
  api:
    environment:
      HOST: 127.0.0.1
      SERVE_AUDIO_VIA_PROXY: "true"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - api
    environment:
      PONGO_DOMAIN: ${PONGO_DOMAIN:?Set PONGO_DOMAIN in .env to the server's hostname}
      PONGO_TLS_PORT: ${PONGO_TLS_PORT:-9090}
      API_PORT: ${API_PORT:-8081}
    volumes:
      - ./caddy/Caddyfile.own-cert:/etc/caddy/Caddyfile:ro
      - ./secrets/tls:/certs:ro
      # The audio files, which Caddy sends for the API
      - pongo_audio:/srv/pongo:ro
    read_only: true
    # Nothing to keep: the certificate comes from ./secrets/tls
    tmpfs:
      - /tmp
      - /data
      - /config
    cap_drop:
      - ALL
    # The caddy binary carries this file capability and won't start without it
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
