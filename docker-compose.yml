services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pongo_db
      POSTGRES_USER: pongo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pongo_db:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pongo_user -d pongo_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api/pongo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pongo_user:${DB_PASSWORD}@db:5432/pongo_db
      DATA_DIR: /data
    ports:
      - "${API_PORT:-8081}:8081"
    volumes:
      - pongo_audio:/data
      - ./secrets:/run/pongo-secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pongo_db:
  pongo_audio:
