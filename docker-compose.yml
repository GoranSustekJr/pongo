services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pongo_db
      POSTGRES_USER: pongo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pongo_db:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pongo_user -d pongo_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api/pongo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pongo_user:${DB_PASSWORD}@db:5432/pongo_db
      DATA_DIR: /data
    ports:
      - "${API_PORT:-8081}:8081"
    volumes:
      - pongo_audio:/data
      - ./secrets:/run/pongo-secrets:ro
    # Only /data and the scratch spaces below can be written
    read_only: true
    tmpfs:
      - /tmp
      # yt-dlp's and deno's caches
      - /home/pongo/.cache:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  pongo_db:
  pongo_audio:
