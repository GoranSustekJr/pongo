# HTTPS on PONGO_TLS_PORT with a Let's Encrypt certificate from the DNS check, for
# when ports 80 and 443 can't be forwarded. Needs a Duck DNS hostname; on top of
# docker-compose.host.yml:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.host.yml:docker-compose.dns.yml
# Set PONGO_DOMAIN=<name>.duckdns.org and DUCKDNS_TOKEN in .env. Clients that
# connect by the server's IP address get the certificate in ./secrets/tls, as
# with docker-compose.own-cert.yml; list those addresses in PONGO_OWN_CERT_SITES,
# such as "https://192.168.1.10:9090, https://192.168.1.11:9090". The API then only listens on 127.0.0.1, behind Caddy.
services:
  api:
    environment:
      HOST: 127.0.0.1
      SERVE_AUDIO_VIA_PROXY: "true"
  caddy:
    build:
      context: ./caddy
      network: host
    image: pongo-caddy-dns
    restart: unless-stopped
    network_mode: host
    depends_on:
      - api
    environment:
      PONGO_DOMAIN: ${PONGO_DOMAIN:?Set PONGO_DOMAIN in .env to the Duck DNS hostname}
      PONGO_TLS_PORT: ${PONGO_TLS_PORT:-9090}
      API_PORT: ${API_PORT:-8081}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?Set DUCKDNS_TOKEN in .env}
      PONGO_OWN_CERT_SITES: ${PONGO_OWN_CERT_SITES:?Set PONGO_OWN_CERT_SITES in .env to the addresses that use secrets/tls}
    volumes:
      - ./caddy/Caddyfile.dns:/etc/caddy/Caddyfile:ro
      - ./secrets/tls:/certs:ro
      # Certificates, so a restart doesn't request new ones
      - caddy_data:/data
      # The audio files, which Caddy sends for the API
      - pongo_audio:/srv/pongo:ro
    read_only: true
    tmpfs:
      - /tmp
      - /config
    cap_drop:
      - ALL
    # The caddy binary carries this file capability and won't start without it
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
  # Points the Duck DNS hostname at this network's public address
  duckdns:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    network_mode: host
    environment:
      PONGO_DOMAIN: ${PONGO_DOMAIN}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          curl -fsS -m 30 "https://www.duckdns.org/update?domains=$${PONGO_DOMAIN%.duckdns.org}&token=$${DUCKDNS_TOKEN}&ip=" -o /dev/null || echo "Duck DNS update failed"
          sleep 300
        done
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m

volumes:
  caddy_data:
